name: MARKIO one-time VAPID setup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Select the exact confirmation to authorize production VAPID setup
        required: true
        type: choice
        default: DO_NOT_RUN
        options:
          - DO_NOT_RUN
          - CONFIGURE_MARKIO_VAPID

permissions:
  contents: read

concurrency:
  group: markio-vapid-production-setup
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'CONFIGURE_MARKIO_VAPID'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: '2.84.2'

      - name: Generate and configure VAPID keys
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_PROJECT_REF: gxiirebjidkgucucegzn
          VERCEL_PROJECT_ID: prj_0jT42nxMmHbqcnKYJJQCdLhSVzW0
          VERCEL_TEAM_ID: team_hp5gcmhb4rkGvaYE5Lnzcj5f
        run: |
          set -euo pipefail
          set +x

          : "${SUPABASE_ACCESS_TOKEN:?Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN}"
          : "${VERCEL_TOKEN:?Missing GitHub Actions secret VERCEL_TOKEN}"

          WORK_DIR="$(mktemp -d "${RUNNER_TEMP}/markio-vapid.XXXXXX")"
          chmod 700 "$WORK_DIR"
          SUPABASE_SET_SUCCEEDED=false

          cleanup() {
            local exit_code=$?
            # Remove only the exact Vercel environment-variable record created by this run,
            # and only when Supabase did not accept the matching key pair.
            if [[ "$SUPABASE_SET_SUCCEEDED" != "true" && -f "$WORK_DIR/vercel-env-id.txt" ]]; then
              WORK_DIR="$WORK_DIR" node <<'NODE' >/dev/null 2>&1 || true
          const fs = require('node:fs');
          const path = require('node:path');
          const id = fs.readFileSync(path.join(process.env.WORK_DIR, 'vercel-env-id.txt'), 'utf8').trim();
          const url = new URL(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}/env/${id}`);
          url.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);
          fetch(url, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` }
          }).then((response) => {
            if (!response.ok && response.status !== 404) process.exitCode = 1;
          }).catch(() => { process.exitCode = 1; });
          NODE
            fi
            rm -rf "$WORK_DIR"
            return "$exit_code"
          }
          trap cleanup EXIT

          # Read-only Supabase preflight. Do not read or alter the existing subject value.
          if ! supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" >"$WORK_DIR/supabase-before.txt" 2>&1; then
            echo "::error::Supabase secret listing failed. Check token access to project Edge Function Secrets."
            exit 1
          fi
          if ! grep -Fq "MARKIO_VAPID_SUBJECT" "$WORK_DIR/supabase-before.txt"; then
            echo "::error::Existing MARKIO_VAPID_SUBJECT was not found. No changes were made."
            exit 1
          fi
          if grep -Eq "MARKIO_VAPID_(PUBLIC|PRIVATE)_KEY" "$WORK_DIR/supabase-before.txt"; then
            echo "::error::At least one VAPID key already exists. Refusing to overwrite either key."
            exit 1
          fi

          # Read-only Vercel preflight. Do not overwrite an existing public-key variable.
          node <<'NODE'
          const url = new URL(`https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`);
          url.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);
          url.searchParams.set('decrypt', 'false');
          url.searchParams.set('limit', '100');
          (async () => {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` }
            });
            if (!response.ok) throw new Error(`Vercel environment preflight failed (HTTP ${response.status}).`);
            const data = await response.json();
            if (!Array.isArray(data.envs)) throw new Error('Unexpected Vercel environment response.');
            if (data.envs.some((entry) => entry.key === 'VITE_MARKIO_VAPID_PUBLIC_KEY')) {
              throw new Error('VITE_MARKIO_VAPID_PUBLIC_KEY already exists. Refusing to overwrite it.');
            }
          })().catch((error) => {
            process.stderr.write(`${error.message}\n`);
            process.exitCode = 1;
          });
          NODE

          # Install the same web-push version used by the deployed Edge Function.
          if ! npm install --prefix "$WORK_DIR" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund web-push@3.6.7 >"$WORK_DIR/npm-install.log" 2>&1; then
            echo "::error::Could not install the pinned web-push library."
            exit 1
          fi

          # Generate once, inside this ephemeral runner. Key values are never written to logs.
          WORK_DIR="$WORK_DIR" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const webpush = require(path.join(process.env.WORK_DIR, 'node_modules', 'web-push'));
          const keys = webpush.generateVAPIDKeys();
          if (!keys.publicKey || !keys.privateKey) throw new Error('VAPID key generation failed.');
          fs.writeFileSync(path.join(process.env.WORK_DIR, 'supabase-vapid.env'), [
            `MARKIO_VAPID_PUBLIC_KEY=${keys.publicKey}`,
            `MARKIO_VAPID_PRIVATE_KEY=${keys.privateKey}`,
            ''
          ].join('\n'), { mode: 0o600, flag: 'wx' });
          fs.writeFileSync(path.join(process.env.WORK_DIR, 'vercel-public-key.txt'), keys.publicKey, {
            mode: 0o600,
            flag: 'wx'
          });
          NODE

          # Configure only the public key in Vercel.
          WORK_DIR="$WORK_DIR" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const publicKey = fs.readFileSync(path.join(process.env.WORK_DIR, 'vercel-public-key.txt'), 'utf8');
          const url = new URL(`https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`);
          url.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);
          (async () => {
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                key: 'VITE_MARKIO_VAPID_PUBLIC_KEY',
                value: publicKey,
                type: 'plain',
                target: ['production', 'preview', 'development']
              })
            });
            if (!response.ok) throw new Error(`Vercel could not create the public environment variable (HTTP ${response.status}).`);
            const result = await response.json();
            if (!result.id) throw new Error('Vercel did not return an environment-variable ID.');
            fs.writeFileSync(path.join(process.env.WORK_DIR, 'vercel-env-id.txt'), result.id, {
              mode: 0o600,
              flag: 'wx'
            });
          })().catch((error) => {
            process.stderr.write(`${error.message}\n`);
            process.exitCode = 1;
          });
          NODE

          # Send exactly the two missing keys. The existing subject is not in this env file.
          if ! supabase secrets set --env-file "$WORK_DIR/supabase-vapid.env" --project-ref "$SUPABASE_PROJECT_REF" --yes >"$WORK_DIR/supabase-set.log" 2>&1; then
            echo "::error::Supabase rejected the secret update. The workflow will remove only the Vercel variable created by this run."
            exit 1
          fi
          SUPABASE_SET_SUCCEEDED=true

          # Verify secret names only. Never retrieve or print secret values.
          if ! supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" >"$WORK_DIR/supabase-after.txt" 2>&1; then
            echo "::error::Supabase accepted the update, but secret-name verification failed. The new values were left in place for safe manual verification."
            exit 1
          fi
          for name in MARKIO_VAPID_SUBJECT MARKIO_VAPID_PUBLIC_KEY MARKIO_VAPID_PRIVATE_KEY; do
            if ! grep -Fq "$name" "$WORK_DIR/supabase-after.txt"; then
              echo "::error::A required Supabase secret name was not verified. Existing values were not deleted."
              exit 1
            fi
          done

          # Verify Vercel variable name and all intended environments without decrypting its value.
          WORK_DIR="$WORK_DIR" node <<'NODE'
          const url = new URL(`https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`);
          url.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);
          url.searchParams.set('decrypt', 'false');
          url.searchParams.set('limit', '100');
          (async () => {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` }
            });
            if (!response.ok) throw new Error(`Vercel verification failed (HTTP ${response.status}).`);
            const data = await response.json();
            const expected = ['production', 'preview', 'development'];
            const fs = require('node:fs');
            const path = require('node:path');
            const expectedValue = fs.readFileSync(path.join(process.env.WORK_DIR, 'vercel-public-key.txt'), 'utf8');
            const found = data.envs?.find((entry) =>
              entry.key === 'VITE_MARKIO_VAPID_PUBLIC_KEY' &&
              entry.value === expectedValue &&
              expected.every((target) => entry.target?.includes(target))
            );
            if (!found) throw new Error('Vercel public-key value and environment targets could not be verified.');
          })().catch((error) => {
            process.stderr.write(`${error.message}\n`);
            process.exitCode = 1;
          });
          NODE

          echo "MARKIO VAPID secrets and Vercel public environment variable were configured and their names/targets verified. No key values were displayed."

      - name: Redeploy and verify the production frontend
        shell: bash
        env:
          VERCEL_TOKEN: \${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_0jT42nxMmHbqcnKYJJQCdLhSVzW0
          VERCEL_TEAM_ID: team_hp5gcmhb4rkGvaYE5Lnzcj5f
        run: |
          set -euo pipefail
          node <<'NODE'
          const projectId = process.env.VERCEL_PROJECT_ID;
          const teamId = process.env.VERCEL_TEAM_ID;
          const headers = { Authorization: \`Bearer \${process.env.VERCEL_TOKEN}\` };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });
            if (!response.ok) {
              throw new Error(\`Vercel API request failed (HTTP \${response.status}).\`);
            }
            return response.json();
          }

          (async () => {
            const listUrl = new URL('https://api.vercel.com/v13/deployments');
            listUrl.searchParams.set('projectId', projectId);
            listUrl.searchParams.set('teamId', teamId);
            listUrl.searchParams.set('target', 'production');
            listUrl.searchParams.set('limit', '1');

            const listed = await request(listUrl);
            const latest = listed.deployments?.[0];
            const deploymentId = latest?.id || latest?.uid;
            if (!deploymentId || latest?.state !== 'READY') {
              throw new Error('No READY production deployment was found to redeploy.');
            }

            const redeployUrl = new URL('https://api.vercel.com/v13/deployments');
            redeployUrl.searchParams.set('teamId', teamId);
            redeployUrl.searchParams.set('forceNew', '1');
            const created = await request(redeployUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ deploymentId, target: 'production' })
            });

            const newId = created.id || created.uid;
            if (!newId) throw new Error('Vercel did not return a deployment ID.');

            const inspectUrl = new URL(\`https://api.vercel.com/v13/deployments/\${encodeURIComponent(newId)}\`);
            inspectUrl.searchParams.set('teamId', teamId);
            for (let attempt = 0; attempt < 90; attempt += 1) {
              const deployment = await request(inspectUrl);
              if (deployment.readyState === 'READY' || deployment.state === 'READY') {
                process.stdout.write('Production frontend redeployment completed and verified.\\n');
                return;
              }
              if (deployment.readyState === 'ERROR' || deployment.state === 'ERROR') {
                throw new Error('Vercel production redeployment failed.');
              }
              await sleep(5000);
            }
            throw new Error('Timed out while waiting for the production deployment to become READY.');
          })().catch((error) => {
            process.stderr.write(\`\${error.message}\\n\`);
            process.exitCode = 1;
          });
          NODE

